{% extends "base.html" %}

{% block title %}Your candidacy statement{% endblock %}

{% block content %}
  <section class="auth-panel">
    <h1>Your candidacy statement</h1>
    <p class="auth-intro">
      This is the only thing you need to add — your name, photo, and
      affiliations come from your profile automatically.
    </p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="form-actions">
        <button type="submit" class="btn">Save statement</button>
        <a role="button" class="btn-cancel" href="{% url 'elections:detail' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
