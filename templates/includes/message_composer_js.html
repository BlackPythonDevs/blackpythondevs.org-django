{% comment %}
  Live markdown preview for message_composer_fields.html's #id_body /
  #body-preview pair. See message_composer_css.html for the sibling parts.
{% endcomment %}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  (function () {
    if (typeof marked === "undefined") return;
    var textarea = document.getElementById("id_body");
    var preview = document.getElementById("body-preview");
    if (!textarea || !preview) return;

    function render() {
      preview.innerHTML = textarea.value.trim() ? marked.parse(textarea.value) : "";
    }

    textarea.addEventListener("input", render);
    render();
  })();
</script>
