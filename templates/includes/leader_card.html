{% load wagtailimages_tags %}
<article class="leadership-card">
  {% if leader.photo %}
    {% image leader.photo fill-200x200 class="leadership-photo" alt=leader.name %}
  {% elif leader.photo_url %}
    <img class="leadership-photo" src="{{ leader.photo_url }}" alt="photo of {{ leader.name }}" />
  {% endif %}
  <div>
    <strong>{{ leader.name }}</strong><br />
    <small style="color: var(--bpd-muted);">{{ leader.title }}</small>
  </div>
</article>
