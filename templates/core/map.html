{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Python Devs community map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    #map { position: absolute; inset: 0; }
    .leaflet-container { font-size: 1rem; background: #262626; }
    .map-popup strong { display: block; font-size: 14px; text-decoration: underline; margin-bottom: 4px; }
    .map-popup ul { margin: 0; padding-left: 1.1em; }
    .map-legend { background: rgba(20, 20, 20, 0.85); color: #fff; padding: 6px 10px; border-radius: 4px; line-height: 1.6; }
    .map-legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border: 1px solid #fff; }
  </style>
</head>
<body>
  <div id="map" role="region" aria-label="Map of countries with Black Python Devs members or sponsored events"></div>
  {{ presence_countries|json_script:"presence-countries" }}
  <script>
    (function () {
      var COLORS = { both: "#FFB347", members: "#FFD700", events: "#B8860B" };
      var presence = JSON.parse(document.getElementById("presence-countries").textContent);
      var byIso = {};
      presence.forEach(function (c) { byIso[c.iso_a3] = c; });

      var map = L.map("map", {
        center: [20, 0],
        zoom: 2,
        maxBounds: [[-90, -180], [90, 180]],
        zoomControl: true,
      });

      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key={{ carto_api_key }}", {
        minZoom: 2,
        maxZoom: 8,
        maxNativeZoom: 8,
        subdomains: "abcd",
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      }).addTo(map);

      // Reset-zoom control.
      var ResetZoom = L.Control.extend({
        options: { position: "topleft" },
        onAdd: function (m) {
          var container = L.DomUtil.create("div", "leaflet-bar leaflet-control");
          var link = L.DomUtil.create("a", "", container);
          link.href = "#";
          link.title = "Reset map zoom";
          link.setAttribute("role", "button");
          link.textContent = "\u21BA";
          link.style.fontSize = "18px";
          L.DomEvent.on(link, "click", function (e) {
            L.DomEvent.preventDefault(e);
            m.setView([20, 0], 2);
          });
          L.DomEvent.disableClickPropagation(container);
          return container;
        },
      });
      map.addControl(new ResetZoom());

      function colorFor(c) {
        if (c.has_members && c.has_events) return COLORS.both;
        return c.has_members ? COLORS.members : COLORS.events;
      }

      function popupFor(c) {
        var div = document.createElement("div");
        div.className = "map-popup";
        var title = document.createElement("strong");
        title.textContent = c.name;
        div.appendChild(title);
        var list = document.createElement("ul");
        if (c.has_members) {
          var m = document.createElement("li");
          m.textContent = "Members in this country";
          list.appendChild(m);
        }
        if (c.has_events) {
          var e = document.createElement("li");
          e.textContent = "Events held here";
          list.appendChild(e);
        }
        div.appendChild(list);
        return div;
      }

      if (presence.length) {
        var legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
          var div = L.DomUtil.create("div", "map-legend");
          [["members", "Members"], ["events", "Events"], ["both", "Members and events"]].forEach(function (row) {
            var line = document.createElement("div");
            var swatch = document.createElement("i");
            swatch.style.background = COLORS[row[0]];
            line.appendChild(swatch);
            line.appendChild(document.createTextNode(row[1]));
            div.appendChild(line);
          });
          return div;
        };
        legend.addTo(map);

        fetch("{% static 'data/world-countries.geojson' %}")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            L.geoJSON(data, {
              filter: function (f) { return Object.prototype.hasOwnProperty.call(byIso, f.properties.ISO_A3); },
              style: function (f) {
                return { color: "#ffffff", weight: 0.7, fillColor: colorFor(byIso[f.properties.ISO_A3]), fillOpacity: 0.75 };
              },
              onEachFeature: function (f, layer) {
                var c = byIso[f.properties.ISO_A3];
                var tip = document.createElement("span");
                tip.textContent = c.name;
                layer.bindTooltip(tip, { sticky: true });
                layer.bindPopup(popupFor(c));
              },
            }).addTo(map);
          });
      }
    })();
  </script>
</body>
</html>
