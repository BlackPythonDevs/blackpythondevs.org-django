<section>
  {% if value.heading %}<h2>{{ value.heading }}</h2>{% endif %}
  {{ value.intro|safe }}
  <dl class="schedule">
    {% for item in value.items %}
      <dt>{{ item.time }}</dt>
      <dd>
        {{ item.title }}
        {% if item.presenter %}<span class="schedule-presenter">{{ item.presenter }}</span>{% endif %}
      </dd>
    {% endfor %}
  </dl>
</section>
