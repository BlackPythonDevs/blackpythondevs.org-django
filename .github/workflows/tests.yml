name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bpd
          POSTGRES_PASSWORD: bpd
          POSTGRES_DB: bpd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bpd -d bpd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://bpd:bpd@localhost:5432/bpd
      VALKEY_URL: redis://localhost:6379/0
      # Match the production image (Dockerfile: python:3.14-slim). Without this,
      # uv picks the newest Python allowed by requires-python, which can be a
      # release dependencies don't publish wheels for yet.
      UV_PYTHON: "3.14"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-uv replaces mise here: this workflow only needs uv itself, and
      # setup-uv caches uv's package cache and Python toolchain keyed on
      # uv.lock, cutting most of the CI setup time.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -n auto
