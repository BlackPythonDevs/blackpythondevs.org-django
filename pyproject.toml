[project]
name = "blackpythondevs-django"
version = "0.1.0"
description = "Black Python Devs community website — Django + Wagtail"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "wagtail>=7.0,<8.0",
    "django-treebeard<5.3",  # 5.3 adds treebeard.E001 check Wagtail's PageManager fails; see logs
    "django-allauth[socialaccount]>=65.4",
    "psycopg[binary]>=3.2",
    "django-redis>=5.4",
    "django-environ>=0.12",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "Pillow>=11.1",
    "django-widget-tweaks>=1.5",
    "django-storages[s3]>=1.14",
    "markdown>=3.10.2",
    "python-frontmatter>=1.3.0",
    "neapolitan>=26.1",
    "django-countries>=9.0.0",
    "pycountry-convert>=0.7.2",
    "bleach>=6.4.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=5.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 120
# extend-exclude, not exclude: `exclude` would replace ruff's defaults (.venv &c).
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]
# Wagtail's Page base class already provides __str__.
ignore = ["DJ008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bpd.settings.dev"
python_files = ["test_*.py", "tests.py"]
