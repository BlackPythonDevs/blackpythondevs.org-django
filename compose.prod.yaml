# Production stack: Caddy terminates TLS in front of gunicorn.
#
#   fnox exec -- docker compose -f compose.prod.yaml up -d --build
#
# fnox injects the secrets as environment variables, which is where compose's
# ${VAR} interpolation reads them from — so no --env-file is needed, and every
# compose subcommand (exec, logs, down) wants the same `fnox exec --` prefix.
#
# Only Caddy publishes ports. Postgres and Valkey stay on the internal network,
# reachable from the host only through `docker compose exec`.
name: blackpythondevs-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # The real site's values, so a missing .env.production cannot silently
      # fall back to base.py's localhost ALLOWED_HOSTS and 400 every request.
      DOMAIN: ${DOMAIN:-blackpythondevs.org}
      ACME_EMAIL: ${ACME_EMAIL:-contact@blackpythondevs.org}
      # Set to "tls internal" to self-sign for local testing. See the Caddyfile.
      CADDY_TLS_INTERNAL: ${CADDY_TLS_INTERNAL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # issued certificates — losing this re-issues, and
      - caddy_config:/config   # Let's Encrypt rate-limits repeat issuance
      - media_data:/srv/media:ro
    depends_on:
      - web

  # Joins the tailnet and serves the site at https://${TS_HOSTNAME}.<tailnet>.ts.net,
  # which is the only route to /cms and /django-admin. Userspace networking, so
  # it needs no NET_ADMIN, no /dev/net/tun, and no host-network access — it can
  # reach the compose network and nothing else on the box.
  #
  # Requires MagicDNS and HTTPS certificates enabled for the tailnet
  # (Tailscale admin console → DNS), or the serve config below cannot get a cert.
  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-bpd}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME:-bpd}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      # --advertise-tags pins the node to an ACL tag so the key can be reusable
      # and the node never expires. Drop it if the tag is not in your ACLs.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-tags=tag:server}
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - caddy

  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: bpd.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER:-bpd}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bpd}
      VALKEY_URL: redis://valkey:6379/0
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      # TS_FQDN is last so the healthcheck below still picks the public host.
      ALLOWED_HOSTS: ${DOMAIN:-blackpythondevs.org},www.${DOMAIN:-blackpythondevs.org},${TS_FQDN:-tailnet.invalid}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN:-blackpythondevs.org},https://www.${DOMAIN:-blackpythondevs.org},https://${TS_FQDN:-tailnet.invalid}
      WAGTAILADMIN_BASE_URL: https://${DOMAIN:-blackpythondevs.org}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@blackpythondevs.org}
      # Required, not defaulted: allauth is passwordless, so an empty SMTP
      # config locks every user out while the healthcheck still reports green.
      # Failing at `up` is the loud version of that.
      EMAIL_HOST: ${EMAIL_HOST:?set EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:?set EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?set EMAIL_HOST_PASSWORD}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-}
      AWS_S3_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_MEMBER_ROLE_ID: ${DISCORD_MEMBER_ROLE_ID:-}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL:-https://discord.gg/XUc3tFqCT3}
    volumes:
      # No source bind-mount in production: the image carries the code and the
      # static files collected at build time.
      - media_data:/app/media
    healthcheck:
      # SECURE_SSL_REDIRECT would 301 a plain internal request, and the Host
      # must be one Django allows — so the probe mimics what Caddy sends.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ["ALLOWED_HOSTS"].split(",")[0]
          req = urllib.request.Request(
              "http://127.0.0.1:8000/",
              headers={"Host": host, "X-Forwarded-Proto": "https"},
          )
          urllib.request.urlopen(req, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bpd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bpd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpd} -d ${POSTGRES_DB:-bpd}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  valkey_data:
  media_data:
  caddy_data:
  caddy_config:
  tailscale_state:  # node identity — losing it re-registers the node
